default:
  recovery_frac_mass_H2O:
    value: 1      # no water wasting
    units: dimensionless
  default_removal_frac_mass_comp:
    value: 0
    units: dimensionless
  removal_frac_mass_comp:
    bod:
      value: 0
      units: dimensionless
      constituent_longform: Biological Oxygen Demand (BOD)
    tss:
      value: 0
      units: dimensionless
      constituent_longform: Total Suspended Solids (TSS)
    ammonium_as_nitrogen:
      value: 0   # Reactive removal is handled in reaction
      units: dimensionless
    nitrate:     # NO3 are tracked in terms of g-N
      value: 0   # Reactive removal is handled in reaction
      units: dimensionless
  electricity:
    value: 0.08
    units: USD_2020/kWh
  energy_electric_flow_vol_inlet:
    value: 0.5
    units: kWh/m^3
  capital_cost:
    basis: flow_vol
    cost_factor: None
    reference_state:
      value: 45.0
      units: m^3/hr
    capital_a_parameter:
      value: 1.25216e6
      units: USD_2018
    capital_b_parameter:
      value: 1.0
      units: dimensionless

nitrification-stage:    # mabr for nitrification
  media_specific_area: 500.0
  fill_fraction: 0.60
  hydraulic_retention_time: 4.0
  volume: 500
  nitrogen_removal_rate:
    value: 1.1
    units: g/m^2/day
  reactions:
    nitrification:
      key_reactant: ammonium_as_nitrogen
      conversion: 0.7
      stoichiometry:
        ammonium_as_nitrogen:
          conversion_ratio: -1
        nitrate:
          conversion_ratio: 1
        bod:
          conversion_ratio: -2.0 # 2.0g-BOD/g-N

bod-stage: # Biological Oxygen Demand
  media_specific_area: 500.0
  fill_fraction: 0.50
  hydraulic_retention_time: 4.0
  volume: 500
  bod_removal_rate:
    value: 12
    units: g/m^2/day
  reactions:
    bod_removal:
      key_reactant: bod
      conversion: 0.75
      stoichiometry:
        bod:
          conversion_ratio: -1